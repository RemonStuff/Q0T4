name: Corrected attachment TDD (expected failures)

on:
  push:
    branches: [feat/12-attached-references]

permissions:
  contents: read

jobs:
  expected-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore only the task-owned pre-wiring producer in this disposable checkout
        run: git restore --source=5beb3e95eb40ced391356a236a2b409dd17c8f4f -- src/extension.ts
      - run: npm run build && npx tsc -p tsconfig.integration.json
      - name: Require three actual forwarding assertion failures
        shell: bash
        run: |
          set +e
          xvfb-run -a npx vscode-test --label integration --grep 'attached reference forwarding' > "$RUNNER_TEMP/references-red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/references-red.log"
          test "$result" -ne 0
          grep -Eq '  0 passing' "$RUNNER_TEMP/references-red.log"
          grep -Eq '  3 failing' "$RUNNER_TEMP/references-red.log"
          grep -q 'AssertionError' "$RUNNER_TEMP/references-red.log"
          ! grep -q 'These tests must not invoke tools' "$RUNNER_TEMP/references-red.log"
      - run: npm run package
      - name: Require three actual installed-package assertion failures
        shell: bash
        run: |
          set +e
          xvfb-run -a npx vscode-test --label vsix --grep 'attached reference forwarding' > "$RUNNER_TEMP/references-vsix-red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/references-vsix-red.log"
          test "$result" -ne 0
          grep -Eq '  0 passing' "$RUNNER_TEMP/references-vsix-red.log"
          grep -Eq '  3 failing' "$RUNNER_TEMP/references-vsix-red.log"
          grep -q 'AssertionError' "$RUNNER_TEMP/references-vsix-red.log"
          ! grep -q 'These tests must not invoke tools' "$RUNNER_TEMP/references-vsix-red.log"
